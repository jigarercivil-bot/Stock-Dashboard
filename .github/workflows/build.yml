name: Build Stock Dashboard

on:
  schedule:
    # ASX: 5:00pm Sydney Mon–Fri, all year. Scheduled at both 06:00 UTC (summer time) and
    # 07:00 UTC (winter time); the run that isn't 5pm in Sydney skips itself.
    - cron: "0 6 * * 1-5"
    - cron: "0 7 * * 1-5"
    # US: 22:17 UTC Sun–Thu = 9:17am Sydney Mon–Fri (8:17am in winter), after the New York close.
    # Monday morning's run picks up Friday's US close, so nothing runs on a Sydney weekend.
    - cron: "17 22 * * 0-4"
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to rebuild (AU, US or AU,US). The other market keeps its last build. 'none' only rebuilds the page (about 2 minutes)."
        default: "AU,US"
        required: false
      fundamentals_full:
        description: "Fetch every missing or out-of-date company's financials (no 600/800 cap)"
        type: boolean
        default: false
      fund_minutes:
        description: "Minutes per market for fetching financials (40 normally; up to 300 for a catch-up)"
        default: "40"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      # Picks the ASX schedule that matches Sydney's current UTC offset (06:00 UTC in summer time,
      # 07:00 UTC in winter). Goes by the schedule, not the clock, so a run GitHub starts late still runs.
      - name: Run the ASX update for 5pm Sydney time
        id: gate
        run: |
          sched="${{ github.event.schedule }}"
          if [ "$sched" = "0 6 * * 1-5" ] || [ "$sched" = "0 7 * * 1-5" ]; then
            off=$(TZ=Australia/Sydney date +%z)
            want="0 7 * * 1-5"; [ "$off" = "+1100" ] && want="0 6 * * 1-5"
            if [ "$sched" != "$want" ]; then echo "Sydney is UTC$off; the other ASX schedule handles today: skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # Company financials are cached between runs so coverage builds up over time.
      - name: Restore saved data
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: market-cache-${{ github.run_id }}
          restore-keys: market-cache-

      - name: Build Stock Dashboard
        if: steps.gate.outputs.skip != 'true'
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          EULERPOOL_API_KEY: ${{ secrets.EULERPOOL_API_KEY }}
          EP_MINUTES: ${{ inputs.fund_minutes && '120' || '25' }}
          SECQ_MINUTES: ${{ inputs.fund_minutes && '150' || '30' }}
          MARKETS: ${{ (github.event.schedule == '0 6 * * 1-5' || github.event.schedule == '0 7 * * 1-5') && 'AU' || github.event.schedule == '17 22 * * 0-4' && 'US' || inputs.markets || 'AU,US' }}
          FULL: ${{ inputs.fundamentals_full && '--fundamentals-full' || '' }}
          FUND_MINUTES: ${{ inputs.fund_minutes || '40' }}
        # Gentle mode: one company at a time, pauses between, backs off when Yahoo pushes back,
        # and spends at most 40 minutes per market on company financials.
        run: python asx_dashboard.py --markets "$MARKETS" $FULL --scheduled --fund-minutes "$FUND_MINUTES" --fund-delay 2

      - name: Save data for the next run
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: market-cache-${{ github.run_id }}

      - name: Prepare site
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p site/history
          cp output/asx_dashboard_latest.html site/index.html
          cp output/history/*.csv site/history/ 2>/dev/null || true
          echo "Built $(date -u '+%Y-%m-%d %H:%M UTC')" > site/built.txt

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.skip != 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
