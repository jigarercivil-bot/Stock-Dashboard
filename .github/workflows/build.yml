name: Build Stock Dashboard

on:
  schedule:
    # GitHub often starts scheduled runs hours late or drops them, so there are several.
    # Each run works out for itself which market's latest close hasn't been collected yet
    # (ASX after 5pm Sydney, US after 5:15pm New York) and updates only that; otherwise it
    # stops within a minute.
    - cron: "7 6,7,8,9,10,12 * * 1-5"
    - cron: "17 22,23 * * 0-4"
    - cron: "17 0,1,2,3,5 * * 1-5"
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to rebuild (AU, US or AU,US). The other market keeps its last build. 'none' only rebuilds the page (about 2 minutes). 'auto' updates whichever market has a new close."
        default: "AU,US"
        required: false
      fundamentals_full:
        description: "Fetch every missing or out-of-date company's financials (no 600/800 cap)"
        type: boolean
        default: false
      fund_minutes:
        description: "Minutes per market for fetching financials (40 normally; up to 300 for a catch-up)"
        default: "40"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      # Scheduled runs decide in the build step which markets are due.
      - name: Choose what to update
        id: gate
        run: |
          m="${{ inputs.markets || 'AU,US' }}"
          if [ -n "${{ github.event.schedule }}" ] || [ "$m" = "auto" ]; then
            echo "markets=AU,US" >> "$GITHUB_OUTPUT"; echo "auto=--auto" >> "$GITHUB_OUTPUT"
          else
            echo "markets=$m" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # Company financials are cached between runs so coverage builds up over time.
      - name: Restore saved data
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: market-cache-${{ github.run_id }}
          restore-keys: market-cache-

      - name: Build Stock Dashboard
        if: steps.gate.outputs.skip != 'true'
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          EULERPOOL_API_KEY: ${{ secrets.EULERPOOL_API_KEY }}
          EP_MINUTES: ${{ inputs.fund_minutes && '120' || '25' }}
          SECQ_MINUTES: ${{ inputs.fund_minutes && '150' || '30' }}
          MARKETS: ${{ steps.gate.outputs.markets }}
          AUTO: ${{ steps.gate.outputs.auto }}
          FULL: ${{ inputs.fundamentals_full && '--fundamentals-full' || '' }}
          FUND_MINUTES: ${{ inputs.fund_minutes || '40' }}
        # Gentle mode: one company at a time, pauses between, backs off when Yahoo pushes back,
        # and spends at most 40 minutes per market on company financials.
        run: python asx_dashboard.py --markets "$MARKETS" $FULL --scheduled --fund-minutes "$FUND_MINUTES" --fund-delay 2 $AUTO

      - name: Save data for the next run
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: market-cache-${{ github.run_id }}

      - name: Prepare site
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p site/history
          cp output/asx_dashboard_latest.html site/index.html
          cp output/history/*.csv site/history/ 2>/dev/null || true
          echo "Built $(date -u '+%Y-%m-%d %H:%M UTC')" > site/built.txt

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.skip != 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
