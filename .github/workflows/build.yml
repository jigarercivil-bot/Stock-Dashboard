name: Build Stock Dashboard

on:
  schedule:
    # GitHub often starts scheduled runs late and sometimes drops them, so each market has
    # backup times. The first run to start does the update; later ones see it's done and stop.
    # ASX: from 5:07pm Sydney Mon–Fri (summer time; an hour later in winter), with backups.
    - cron: "7 6 * * 1-5"
    - cron: "37 6 * * 1-5"
    - cron: "7 7 * * 1-5"
    - cron: "7 8 * * 1-5"
    - cron: "7 9 * * 1-5"
    # US: from 9:17am Sydney Mon–Fri (8:17am in winter), after the New York close, with backups.
    # Monday morning's run picks up Friday's US close, so nothing runs on a Sydney weekend.
    - cron: "17 22 * * 0-4"
    - cron: "47 23 * * 0-4"
    - cron: "17 1 * * 1-5"
    - cron: "17 3 * * 1-5"
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to rebuild (AU, US or AU,US). The other market keeps its last build. 'none' only rebuilds the page (about 2 minutes)."
        default: "AU,US"
        required: false
      fundamentals_full:
        description: "Fetch every missing or out-of-date company's financials (no 600/800 cap)"
        type: boolean
        default: false
      fund_minutes:
        description: "Minutes per market for fetching financials (40 normally; up to 300 for a catch-up)"
        default: "40"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      # Which market a scheduled run is for, and no ASX update before 5pm Sydney time.
      - name: Choose what to update
        id: gate
        run: |
          sched="${{ github.event.schedule }}"
          mk="${{ inputs.markets || 'AU,US' }}"
          if [ -n "$sched" ]; then
            hr=$(echo "$sched" | awk '{print $2}')
            if [ "$hr" -ge 6 ] && [ "$hr" -le 9 ]; then
              mk="AU"
              h=$(TZ=Australia/Sydney date +%H)
              if [ "$h" -lt 17 ] && [ "$h" -ge 8 ]; then echo "Sydney time is ${h}:xx, before 5pm: skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            else
              mk="US"
            fi
          fi
          echo "markets=$mk" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # Company financials are cached between runs so coverage builds up over time.
      - name: Restore saved data
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: market-cache-${{ github.run_id }}
          restore-keys: market-cache-

      - name: Build Stock Dashboard
        if: steps.gate.outputs.skip != 'true'
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          EULERPOOL_API_KEY: ${{ secrets.EULERPOOL_API_KEY }}
          EP_MINUTES: ${{ inputs.fund_minutes && '120' || '25' }}
          SECQ_MINUTES: ${{ inputs.fund_minutes && '150' || '30' }}
          MARKETS: ${{ steps.gate.outputs.markets }}
          SKIP_FRESH: ${{ github.event.schedule && '10' || '0' }}
          FULL: ${{ inputs.fundamentals_full && '--fundamentals-full' || '' }}
          FUND_MINUTES: ${{ inputs.fund_minutes || '40' }}
        # Gentle mode: one company at a time, pauses between, backs off when Yahoo pushes back,
        # and spends at most 40 minutes per market on company financials.
        run: python asx_dashboard.py --markets "$MARKETS" $FULL --scheduled --fund-minutes "$FUND_MINUTES" --fund-delay 2 --skip-if-built-within "$SKIP_FRESH"

      - name: Save data for the next run
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: market-cache-${{ github.run_id }}

      - name: Prepare site
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p site/history
          cp output/asx_dashboard_latest.html site/index.html
          cp output/history/*.csv site/history/ 2>/dev/null || true
          echo "Built $(date -u '+%Y-%m-%d %H:%M UTC')" > site/built.txt

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.skip != 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
