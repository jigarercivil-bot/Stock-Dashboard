name: Probe (temporary)
on:
  workflow_dispatch:
    inputs:
      codes:
        default: "CBA,CSL,WES,WOW,XRO,PME,JBH,PLS,ALL,EIQ"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: python tools/probe_roic.py "${{ inputs.codes }}"
        env:
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
