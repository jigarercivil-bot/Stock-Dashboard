name: Probe (temporary)
on:
  workflow_dispatch:
    inputs:
      codes:
        default: "BHP,CBA,CSL,WES,WOW,TLS,XRO,PME,JBH,PLS,NST,ALL,REA,COH,SIG,FMG,MIN,LTR,EIQ,KOA"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python tools/probe_interim.py "${{ inputs.codes }}"
